<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Abitur-Lernplattform</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#2f5fd0">
<meta name="description" content="Lernplaner für das Landesabitur Hessen: Plan, Lernzettel, Karteikarten, Prüfungstraining.">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Abi-Lernen">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..700&family=Figtree:wght@400;500;600;700&display=swap">
<style>
:root{--bg:#f4f5f2;--card:#fff;--tx:#1d1d1b;--mu:#66665f;--bd:#e0e0d8;--ac:#2f5fd0;--ac2:#e6edfc;--ok:#2e8b57;--wip:#d98a00;--bad:#c0392b;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#141413;--card:#212120;--tx:#f0f0ec;--mu:#a3a39c;--bd:#34342f;--ac:#7ea2ff;--ac2:#232c47;--ok:#5cc08a;--wip:#f0b040;--bad:#ff8a7a}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#141413;--card:#212120;--tx:#f0f0ec;--mu:#a3a39c;--bd:#34342f;--ac:#7ea2ff;--ac2:#232c47;--ok:#5cc08a;--wip:#f0b040;--bad:#ff8a7a}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:17px/1.55 system-ui,-apple-system,"Segoe UI",sans-serif}
header{background:var(--card);border-bottom:1px solid var(--bd);position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
.hin{max-width:1100px;margin:0 auto;padding:12px 20px 0}
h1{font-size:22px;margin:0 0 10px}
nav{display:flex;gap:4px;overflow-x:auto}
nav button{flex:none;border:0;border-bottom:3px solid transparent;background:none;color:var(--mu);padding:10px 14px;font:inherit;font-size:16px;cursor:pointer}
nav button.on{color:var(--ac);border-color:var(--ac);font-weight:600}
main{max-width:1100px;margin:0 auto;padding:16px 20px 120px}
.grid{display:grid;gap:var(--gap,16px);grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:var(--pad,20px);margin:0 0 16px}
.grid .card{margin:0}
.hero{background:var(--ac2);border:0;display:flex;gap:24px;flex-wrap:wrap;align-items:center;justify-content:space-between}
.big{font-size:44px;font-weight:700;line-height:1.1}
h2{font-size:22px;margin:0 0 10px}h3{font-size:18px;margin:0 0 8px}
.mu{color:var(--mu);font-size:15px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.sp{justify-content:space-between}
input,select,textarea{font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--bd);border-radius:10px;padding:9px;max-width:100%}
textarea{width:100%;min-height:90px}
.btn{background:var(--ac);color:#fff;border:0;border-radius:10px;padding:10px 18px;font:inherit;cursor:pointer}
.btn.ghost{background:var(--ac2);color:var(--ac)}.btn:disabled{opacity:.5}
.bar{height:10px;background:var(--bd);border-radius:5px;overflow:hidden;margin:8px 0}
.bar i{display:block;height:100%;background:var(--ok)}
.topic{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--bd);cursor:pointer}
.topic.first{border-top:0}
.dot{width:16px;height:16px;border-radius:50%;border:2px solid var(--mu);flex:none}
.s1 .dot{border-color:var(--wip);background:linear-gradient(90deg,var(--wip) 50%,transparent 50%)}
.s2 .dot{border-color:var(--ok);background:var(--ok)}
.tag{font-size:13px;padding:2px 10px;border-radius:10px;background:var(--ac2);color:var(--ac);white-space:nowrap}
.chk{display:flex;gap:8px;padding:4px 0}.ok{color:var(--ok)}.bad{color:var(--bad)}
.tile{cursor:pointer}
.out{white-space:pre-wrap;word-wrap:break-word}
ul{padding-left:20px;margin:6px 0}
.tt{overflow-x:auto;border:1px solid var(--bd);border-radius:12px;background:var(--card)}
.ttg{display:grid;min-width:780px}
.th{padding:6px 4px;text-align:center;border-bottom:1px solid var(--bd);border-left:1px solid var(--bd);font-size:14px}
.td{background:var(--ac2)}
.tc{position:relative;border-left:1px solid var(--bd);background-image:linear-gradient(var(--bd) 1px,transparent 1px)}
.tb{position:absolute;left:2px;right:2px;border-radius:6px;padding:3px 5px;font-size:12px;line-height:1.25;overflow:hidden;cursor:pointer;border-left:4px solid}
.hl{position:absolute;right:4px;font-size:11px;color:var(--mu)}
#bar{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom,0px);z-index:10}
#bar button,.sh button{flex:1;border:0;background:none;color:var(--mu);font:inherit;font-size:12px;padding:8px 2px;cursor:pointer}
#bar button span,.sh button span{display:block;font-size:22px;line-height:1.2}
#bar button.on{color:var(--ac);font-weight:600}
.ov{position:fixed;left:0;right:0;top:0;bottom:calc(62px + env(safe-area-inset-bottom,0px));background:rgba(0,0,0,.35);z-index:9;display:flex;align-items:flex-end}
.sh{background:var(--card);width:100%;border-radius:18px 18px 0 0;padding:14px;display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.sh button{border:1px solid var(--bd);border-radius:12px;color:var(--tx);font-size:14px;padding:12px 4px}
.zt{background:var(--card);border:1px solid var(--bd);border-radius:14px;margin:0 0 12px;overflow:hidden}
.zt>summary{padding:14px 16px;cursor:pointer;list-style:none;display:flex;justify-content:space-between;gap:8px}
.zt>summary::-webkit-details-marker{display:none}
.zt>summary::after{content:"▾";color:var(--mu)}.zt[open]>summary::after{content:"▴"}
.zb-body{padding:4px 18px 16px;border-top:1px solid var(--bd);font:17px/1.7 Georgia,"Times New Roman",serif}
.zb-body .zh{font:600 19px system-ui,sans-serif;margin:24px 0 6px;color:var(--ac);border-bottom:2px solid var(--ac2);padding-bottom:4px}
.zb-body p{margin:8px 0}
.zbx{--c:var(--ac);border-left:5px solid var(--c);border-radius:8px;padding:10px 14px;margin:12px 0;font:15.5px/1.55 system-ui,sans-serif;background:color-mix(in srgb,var(--c) 12%,var(--card))}
.zbx.merke{--c:var(--wip)}.zbx.achtung{--c:var(--bad)}.zbx.beispiel{--c:var(--ok)}.zbx.tipp{--c:#8a63d2}
.zf{text-align:center;font:italic 20px Georgia,serif;padding:12px;background:var(--bg);border-radius:8px;margin:10px 0;overflow-x:auto}
.zfl{display:flex;flex-wrap:wrap;align-items:stretch;gap:6px;margin:14px 0;font-family:system-ui,sans-serif}
.zn{background:var(--ac2);border:1px solid var(--ac);border-radius:10px;padding:8px 12px;font-size:14.5px;line-height:1.4}
.za{align-self:center;color:var(--ac);font-weight:700}
.ztl{border-left:3px solid var(--ac);margin:14px 0 14px 8px;padding-left:18px;font:15px/1.5 system-ui,sans-serif}
.ztl div{position:relative;margin:9px 0}.ztl div::before{content:"";position:absolute;left:-26px;top:6px;width:11px;height:11px;border-radius:50%;background:var(--ac)}.ztl b{color:var(--ac)}
.zta{overflow-x:auto;margin:12px 0}.zta table{border-collapse:collapse;font:15px system-ui,sans-serif}.zta th,.zta td{border:1px solid var(--bd);padding:6px 10px;text-align:left}.zta th{background:var(--ac2)}
.zmm{margin:14px 0;font-family:system-ui,sans-serif;text-align:center}.zmc{display:inline-block;background:var(--ac);color:#fff;border-radius:20px;padding:8px 18px;font-weight:700;margin-bottom:10px}
.zmg{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px;text-align:left}.zmb{border:2px solid var(--ac);border-radius:12px;padding:8px 12px;font-size:14px;line-height:1.45}.zmb b{color:var(--ac)}
.zq{font:15.5px/1.5 system-ui,sans-serif;margin:6px 0;border:1px solid var(--bd);border-radius:8px;padding:8px 12px}.zq summary{cursor:pointer;font-weight:600}

/* ===== MODERN-LAYER: ruhige Flächen, weiche Schatten, runde Ecken, viel Luft =====
   Layout: helle, leicht bläuliche Grundfläche; Karten schweben mit zweistufigem Schatten; Kopf- und Tab-Leiste aus Milchglas. */
:root{--bg:#f3f5f9;--card:#fff;--tx:#161a23;--mu:#5d6475;--bd:#e4e8f0;
  --r:20px;--r-sm:12px;
  --sh1:0 1px 2px rgba(22,30,50,.04),0 3px 10px rgba(22,30,50,.05);
  --sh2:0 2px 4px rgba(22,30,50,.05),0 14px 34px -8px rgba(22,30,50,.16);
  --glass:color-mix(in srgb,var(--card) 82%,transparent);
  --f-ui:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-hd:"Bricolage Grotesque","Figtree",system-ui,-apple-system,"Segoe UI",sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#111319;--card:#1a1d25;--tx:#eef0f5;--mu:#9aa1b2;--bd:#2a2f3b;
  --sh1:0 1px 2px rgba(0,0,0,.35),0 3px 10px rgba(0,0,0,.2);--sh2:0 2px 6px rgba(0,0,0,.35),0 16px 38px -8px rgba(0,0,0,.55)}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#111319;--card:#1a1d25;--tx:#eef0f5;--mu:#9aa1b2;--bd:#2a2f3b;
  --sh1:0 1px 2px rgba(0,0,0,.35),0 3px 10px rgba(0,0,0,.2);--sh2:0 2px 6px rgba(0,0,0,.35),0 16px 38px -8px rgba(0,0,0,.55)}

body{font:16.5px/1.6 var(--f-ui);-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}
h1,h2,h3{font-family:var(--f-hd);letter-spacing:-.015em;text-wrap:balance;line-height:1.25}
h1{font-size:20px;font-weight:700;margin:0 0 14px}
h2{font-size:24px;font-weight:650;margin:0 0 14px}
h3{font-size:18px;font-weight:600;margin:0 0 10px}
.mu{font-size:14.5px}

header{background:var(--glass);-webkit-backdrop-filter:saturate(1.6) blur(16px);backdrop-filter:saturate(1.6) blur(16px);border-bottom:1px solid color-mix(in srgb,var(--bd) 70%,transparent)}
.hin{max-width:1120px;padding:16px 24px 2px}
main{max-width:1120px;padding:28px 24px 150px}

.grid{gap:var(--gap,20px)}
.card{border:1px solid color-mix(in srgb,var(--bd) 65%,transparent);border-radius:var(--r);padding:var(--pad,24px);margin:0 0 var(--gap,20px);box-shadow:var(--sh1)}
.card.tile{transition:transform .2s ease,box-shadow .2s ease}
.card.tile:hover{transform:translateY(-2px);box-shadow:var(--sh2)}
.hero{border:0;border-radius:24px;padding:32px;gap:28px;box-shadow:none;background:linear-gradient(135deg,var(--ac2),color-mix(in srgb,var(--ac) 5%,var(--card)))}
.big{font-family:var(--f-hd);font-size:52px;letter-spacing:-.025em;font-variant-numeric:tabular-nums;margin:4px 0}
.big .mu{font-family:var(--f-ui);font-size:18px;letter-spacing:0;font-weight:500}

input,select,textarea{border-radius:var(--r-sm);padding:10px 14px;background:var(--card);border:1px solid var(--bd);transition:border-color .15s,box-shadow .15s}
input:focus,select:focus,textarea:focus{outline:0;border-color:var(--ac);box-shadow:0 0 0 4px color-mix(in srgb,var(--ac) 18%,transparent)}
.btn{border-radius:12px;padding:11px 20px;font-weight:600;letter-spacing:.005em;box-shadow:0 1px 2px rgba(22,30,50,.1),0 6px 16px -6px color-mix(in srgb,var(--ac) 60%,transparent);transition:transform .15s ease,box-shadow .15s ease,background .15s}
.btn:hover:not(:disabled){transform:translateY(-1px)}
.btn.ghost{box-shadow:none}
.btn.ghost:hover:not(:disabled){background:color-mix(in srgb,var(--ac) 20%,var(--card))}
.btn:focus-visible,#bar button:focus-visible,.sh button:focus-visible,.topic:focus-visible{outline:2px solid var(--ac);outline-offset:2px}

.bar{height:8px;border-radius:99px;background:color-mix(in srgb,var(--bd) 80%,transparent);margin:12px 0}
.bar i{border-radius:99px;background:linear-gradient(90deg,var(--ok),color-mix(in srgb,var(--ok) 65%,var(--card)))}
.topic{padding:12px 10px;margin:0 -10px;border-radius:var(--r-sm);border-top-color:color-mix(in srgb,var(--bd) 70%,transparent);transition:background .15s}
.topic:hover{background:var(--bg)}
.tag{border-radius:99px;padding:3px 12px;font-size:12.5px;font-weight:600}
.chk{gap:10px;padding:6px 0}

.tt{border-radius:var(--r);border-color:color-mix(in srgb,var(--bd) 65%,transparent);box-shadow:var(--sh1)}
.th{padding:10px 4px}
.tb{border-radius:8px;border-left-width:3px;padding:4px 6px;box-shadow:0 1px 2px rgba(22,30,50,.08)}

#bar{background:var(--glass);-webkit-backdrop-filter:saturate(1.6) blur(18px);backdrop-filter:saturate(1.6) blur(18px);border-top:1px solid color-mix(in srgb,var(--bd) 70%,transparent);box-shadow:0 -8px 28px -14px rgba(22,30,50,.22);padding-inline:max(8px,env(safe-area-inset-left,0px)) max(8px,env(safe-area-inset-right,0px))}
#bar button{padding:10px 2px 9px;font-weight:500;border-radius:12px;transition:color .15s}
#bar button.on span{background:var(--ac2);border-radius:99px;margin:0 auto;width:52px}
.ov{background:rgba(10,14,25,.32);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px)}
.sh{border-radius:24px 24px 0 0;padding:20px;gap:12px;box-shadow:var(--sh2)}
.sh button{border:0;border-radius:16px;background:var(--bg);padding:16px 6px;font-weight:500;transition:background .15s}
.sh button:hover{background:var(--ac2)}

.zt{border:1px solid color-mix(in srgb,var(--bd) 65%,transparent);border-radius:var(--r);box-shadow:var(--sh1);margin:0 0 14px}
.zt>summary{padding:18px 22px}
.zb-body{padding:8px 26px 24px;font:16.5px/1.75 var(--f-ui);border-top-color:color-mix(in srgb,var(--bd) 70%,transparent)}
.zb-body p{max-width:70ch}
.zb-body .zh{font:650 20px/1.3 var(--f-hd);margin:30px 0 8px;border-bottom:0;padding-bottom:0;letter-spacing:-.01em}
.zb-body h4{font-family:var(--f-hd)!important}
.zbx{border-left-width:4px;border-radius:var(--r-sm);padding:14px 18px;margin:16px 0;font:15.5px/1.6 var(--f-ui)}
.zf{font:500 18px/1.5 var(--f-ui);border-radius:var(--r-sm);padding:14px;font-variant-numeric:tabular-nums}
.zfl{gap:8px;font-family:var(--f-ui)}
.zn{border-radius:12px;padding:10px 14px;border-color:color-mix(in srgb,var(--ac) 45%,transparent)}
.ztl{font-family:var(--f-ui)}
.zta table{font-family:var(--f-ui);border-radius:var(--r-sm);overflow:hidden}
.zmm{font-family:var(--f-ui)}.zmc{border-radius:99px;padding:9px 20px}
.zmb{border-width:1.5px;border-radius:14px;padding:12px 14px}
.zq{font-family:var(--f-ui);border-radius:var(--r-sm);padding:10px 14px}

/* ===== DASHBOARD (Startseite) ===== */
main{max-width:1040px;margin-inline:auto}
.hin.hbar{display:flex;align-items:center;justify-content:flex-end;gap:12px;max-width:1040px;padding-block:8px;min-height:52px}
.dhero{display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;padding:40px 24px 44px;margin:0 0 var(--gap,20px);border-radius:24px;background:linear-gradient(135deg,var(--ac2),color-mix(in srgb,var(--ac) 5%,var(--card)))}
.eyebrow{font-size:12.5px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--ac)}
.dhero .big{font-size:68px;margin:0}
.dlead{font-size:17px;color:var(--mu)}.dlead b{color:var(--tx);font-weight:600}
.chip{display:inline-flex;align-items:center;gap:6px;margin-top:6px;padding:6px 14px;border-radius:99px;font-size:14px;font-weight:600;background:color-mix(in srgb,currentColor 12%,var(--card))}
.dash{display:grid;gap:var(--gap,20px);grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));margin:0 0 var(--gap,20px)}
.dash .card{margin:0}
.dcard{display:flex;flex-direction:column;gap:16px;min-height:236px;cursor:pointer}
.dhead{display:flex;align-items:center;gap:12px}.dhead h3{margin:0;flex:1;font-size:19px}
.dic{width:46px;height:46px;border-radius:14px;background:var(--ac2);display:grid;place-items:center;font-size:22px;flex:none}
.dgo{color:var(--mu);font-size:26px;line-height:1;transition:transform .2s,color .2s}
.dcard:hover .dgo,.dcard:focus-visible .dgo{transform:translateX(3px);color:var(--ac)}
.dcard:focus-visible{outline:2px solid var(--ac);outline-offset:3px}
.dnum{font:700 42px/1 var(--f-hd);letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.dnum span{font:500 15px var(--f-ui);color:var(--mu);letter-spacing:0}
.dbody{display:flex;flex-direction:column;gap:9px;font-size:15px}
.dli{display:flex;align-items:center;gap:10px;min-width:0}
.dli i{width:9px;height:9px;border-radius:50%;flex:none}
.dli .dlt{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dli .mu{font-size:13px;font-variant-numeric:tabular-nums;flex:none}
.dpr{display:grid;grid-template-columns:64px 1fr 42px;align-items:center;gap:10px;font-size:14px}
.dpr .bar{margin:0}.dpr .mu{text-align:right;font-size:13px;font-variant-numeric:tabular-nums}
.dpills{display:flex;flex-wrap:wrap;gap:6px}
.dcta{margin-top:auto;color:var(--ac);font-weight:600;font-size:14.5px}
.sec{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin:12px 0 14px}.sec h2{margin:0}
.nrow{display:flex;gap:10px;align-items:center}.nrow .topic{flex:1}
/* Schulstundenplan + einklappbare Einstellungen */
.sg{display:grid;min-width:580px;grid-template-columns:58px repeat(5,minmax(96px,1fr));grid-template-rows:auto repeat(11,minmax(48px,auto));gap:4px;padding:12px}
.sgh{text-align:center;padding:6px 2px;font-size:14px;border-radius:10px}.sgh.td{background:var(--ac2);color:var(--ac)}
.sgp{font-size:11.5px;color:var(--mu);text-align:right;padding:5px 8px 0 0;line-height:1.25;font-variant-numeric:tabular-nums}.sgp b{display:block;color:var(--tx);font-size:13px}
.sl{display:flex;flex-direction:column;gap:1px;border-radius:10px;border-left:4px solid;padding:6px 9px;font-size:12.5px;line-height:1.3;overflow:hidden;box-shadow:0 1px 2px rgba(22,30,50,.08)}
.sl b{font-size:13.5px}.sl .slr{opacity:.72;font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.set{padding:0;overflow:hidden}
.set>summary{list-style:none;cursor:pointer;display:flex;flex-direction:column;gap:2px;position:relative;padding:20px 60px 20px var(--pad,24px)}
.set>summary::-webkit-details-marker{display:none}.set>summary h3{margin:0}
.set>summary::after{content:"▾";position:absolute;right:24px;top:50%;transform:translateY(-50%);color:var(--mu);font-size:20px;transition:transform .2s}
.set[open]>summary::after{transform:translateY(-50%) rotate(180deg)}
.set>summary:focus-visible{outline:2px solid var(--ac);outline-offset:-2px;border-radius:var(--r)}
.setb{display:flex;flex-direction:column;gap:28px;padding:22px var(--pad,24px) var(--pad,24px);border-top:1px solid color-mix(in srgb,var(--bd) 70%,transparent)}
.setb h3{margin-bottom:4px}

@media (max-width:600px){.dhero{padding:28px 18px 32px}.dhero .big{font-size:54px}.dcard{min-height:0}}

/* ===== Kopfbereich Startseite: Sync-Punkt + Design-Schalter ===== */
.dtop{align-self:stretch;display:flex;justify-content:space-between;align-items:center;gap:12px;margin:-22px -12px 6px}
.sync{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;color:var(--mu);opacity:.8}
.sync i{width:7px;height:7px;border-radius:50%;background:var(--mu);flex:none}
.sync.ok i{background:var(--ok)}.sync.err i{background:var(--bad)}.sync.busy i{background:var(--wip);animation:pulse 1.1s ease-in-out infinite}

/* ===== Bewegung: Seitenwechsel, Tippen, Laden ===== */
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:none}}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{50%{opacity:.35}}
@keyframes shim{from{background-position:100% 0}to{background-position:-100% 0}}
@keyframes blink{50%{opacity:0}}
#view.enter>*{animation:rise .42s cubic-bezier(.2,.8,.2,1) both}
#view.enter>*:nth-child(2){animation-delay:.05s}#view.enter>*:nth-child(3){animation-delay:.1s}#view.enter>*:nth-child(4){animation-delay:.14s}#view.enter>*:nth-child(n+5){animation-delay:.18s}
#view.enter .dash>*{animation:rise .45s cubic-bezier(.2,.8,.2,1) both}
#view.enter .dash>*:nth-child(1){animation-delay:.08s}#view.enter .dash>*:nth-child(2){animation-delay:.12s}#view.enter .dash>*:nth-child(3){animation-delay:.16s}#view.enter .dash>*:nth-child(4){animation-delay:.2s}#view.enter .dash>*:nth-child(5){animation-delay:.24s}#view.enter .dash>*:nth-child(6){animation-delay:.28s}
#view.enter .bar i{transform-origin:left;animation:grow .8s cubic-bezier(.2,.8,.2,1) .2s both}
.btn:active:not(:disabled){transform:scale(.97)}
.card.tile:active{transform:scale(.985)}
.topic:active{background:var(--ac2)}
#bar button span{transition:transform .2s cubic-bezier(.2,.8,.2,1),background .2s}
#bar button:active span{transform:scale(.88)}
.ov{animation:fadeIn .2s ease both}
.sh{animation:slideUp .3s cubic-bezier(.2,.8,.2,1) both}
.zt[open]>.zb-body,.set[open]>.setb,.zq[open]>div{animation:rise .3s cubic-bezier(.2,.8,.2,1) both}
.btn.busy:disabled{opacity:.85;cursor:progress}
.btn.busy::before{content:"";display:inline-block;width:14px;height:14px;margin-right:8px;vertical-align:-2px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:spin .7s linear infinite}
.skel{display:flex;flex-direction:column;gap:12px;padding:6px 0}
.skel i{display:block;height:14px;border-radius:7px;background:linear-gradient(90deg,var(--bd) 0%,color-mix(in srgb,var(--bd) 35%,var(--card)) 50%,var(--bd) 100%);background-size:200% 100%;animation:shim 1.3s ease-in-out infinite}
.live>:last-child::after{content:"";display:inline-block;width:.45em;height:1em;margin-left:3px;vertical-align:-2px;border-radius:2px;background:var(--ac);animation:blink 1s steps(2) infinite}
::view-transition-old(root),::view-transition-new(root){animation-duration:.35s}

.gl h3{margin-bottom:6px}

function parseZ(t){const out=[];let blk=null,cur=null;
  for(const raw of t.split("\n")){const l=raw.trimEnd(),m=l.match(/^:::\s*(\w+)\s*(.*)$/);
    if(blk){if(l.trim()===":::"){out.push(blk);blk=null;}else blk.lines.push(l);continue;}
    if(m){blk={k:m[1].toLowerCase(),a:m[2],lines:[]};cur=null;continue;}
    if(/^# /.test(l)){out.push({k:"title",a:l.slice(2)});cur=null;}
    else if(/^## /.test(l)){out.push({k:"h2",a:l.slice(3)});cur=null;}
    else if(/^### /.test(l)){out.push({k:"h3",a:l.slice(4)});cur=null;}
    else if(l.trim()){if(cur)cur.a+=" "+l.trim();else{cur={k:"p",a:l.trim()};out.push(cur);}}
    else cur=null;}
  if(blk)out.push(blk);return out;}

  if(all.reduce((a,x)=>a+x.c.length,0)>max){const w=(q||"").toLowerCase().split(/[^\p{L}\p{N}]+/u).filter(x=>x.length>2);let n=0;
    all=all.map(x=>({...x,s:w.reduce((a,v)=>a+(x.c.toLowerCase().split(v).length-1),0)})).sort((a,b)=>b.s-a.s).filter(x=>(n+=x.c.length)<=max).sort((a,b)=>a.n.localeCompare(b.n)||a.i-b.i);}

function parseJSON(t){const s=String(t||"").replace(/```json|```/g,"");const a=s.indexOf("["),o=s.indexOf("{");const i=(a>=0&&(o<0||a<o))?a:o;if(i<0)throw 0;const j=s.lastIndexOf(s[i]==="["?"]":"}");return JSON.parse(s.slice(i,j+1));}

const MIME={json:"application/json",html:"text/html",pdf:"application/pdf",txt:"text/plain"};
function browserDownload(filename,data){const blob=data instanceof Blob?data:new Blob([data],{type:(MIME[filename.split(".").pop()]||"application/octet-stream")+";charset=utf-8"});
  const url=URL.createObjectURL(blob),a=document.createElement("a");a.href=url;a.download=filename;a.rel="noopener";document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),5000);}
async function saveFile(filename,data,msg){try{if(!IN_CLAUDE){browserDownload(filename,data);if(msg)msg.textContent="Heruntergeladen: "+filename;return true;}
  const d=await window.claude.use("downloads");if(!d)throw {message:"Speichern ist hier gerade nicht verfügbar."};await d.save({filename,data});if(msg)msg.textContent="Gespeichert: "+filename;return true;}
  catch(e){if(msg)msg.textContent=e&&e.code==="declined"?"Speichern abgebrochen.":e&&e.code==="rate_limited"?"Es ist schon ein Speichern-Dialog offen.":(e&&e.message)||"Speichern ist fehlgeschlagen.";return false;}}

/* --- Lernprotokoll + Streak --- */
function logMin(f,min,src,k){if(min<1)return;Store.state.log.push({d:todayK(),f:f||null,min:Math.round(min),src,k:k||null,ts:Date.now()});}
function unlog(k){Store.state.log=Store.state.log.filter(l=>l.k!==k);}
const minOn=k=>Store.state.log.filter(l=>l.d===k).reduce((a,l)=>a+l.min,0);
function streak(){let n=0,k=todayK();if(minOn(k)<10)k=dayAdd(k,-1);while(minOn(k)>=10&&n<999){n++;k=dayAdd(k,-1);}return n;}
function toggleDone(k,f,len){const S=Store.state;S.done[k]=!S.done[k];if(S.done[k]){delete S.skip[k];logMin(f,len,"block",k);}else unlog(k);Store.save();}
function toggleSkip(k){const S=Store.state;S.skip[k]=!S.skip[k];if(S.skip[k]){S.done[k]=false;unlog(k);}else delete S.skip[k];Store.save();}

/* --- Fokus-Timer (läuft weiter, auch wenn du den Bereich wechselst) --- */
const Timer={left:0,total:0,run:false,f:"",phase:"fokus",iv:null,len:25,
  start(min,f){this.len=min;this.total=min*60;this.left=this.total;this.f=f;this.phase="fokus";this.run=true;this.loop();this.paint();},
  loop(){clearInterval(this.iv);this.iv=setInterval(()=>{if(!this.run)return;this.left--;if(this.left<=0)this.finish();this.paint();},1000);},
  toggle(){this.run=!this.run;this.paint();},
  stop(){if(this.phase==="fokus"){const used=(this.total-this.left)/60;if(used>=1){logMin(this.f,used,"timer");Store.save();}}clearInterval(this.iv);this.run=false;this.total=0;this.left=0;rerender();},
  finish(){if(this.phase==="fokus"){logMin(this.f,this.len,"timer");Store.save();this.phase="pause";this.total=5*60;this.left=this.total;try{navigator.vibrate&&navigator.vibrate([200,100,200]);}catch(e){}}else{clearInterval(this.iv);this.run=false;this.total=0;this.left=0;}rerender();},
  paint(){const t=$("tm-t");if(!t)return;t.textContent=String(Math.floor(this.left/60)).padStart(2,"0")+":"+String(this.left%60).padStart(2,"0");
    const r=$("tm-r");if(r)r.style.strokeDashoffset=String(326.7*(1-(this.total?this.left/this.total:0)));const b=$("tm-p");if(b)b.textContent=this.run?"Pause":"Weiter";
    document.title=this.total?(t.textContent+" · "+(this.phase==="fokus"?"Fokus":"Pause")):"Abitur-Lernplattform";}};
function timerCard(){const S=Store.state,st=streak();
  if(Timer.total)return `<div class="card tmr"><div class="row sp"><h3 style="margin:0">${Timer.phase==="fokus"?"Fokus":"Pause"}${Timer.phase==="fokus"&&Timer.f?" · "+esc(ab(Timer.f)):""}</h3><span class="mu">${Timer.phase==="fokus"?Timer.len+" Min.":"5 Min. durchatmen"}</span></div>
    <div class="tmw"><svg viewBox="0 0 120 120" class="tmring" aria-hidden="true"><circle cx="60" cy="60" r="52" class="tm-bg"/><circle id="tm-r" cx="60" cy="60" r="52" class="tm-fg${Timer.phase==="pause"?" pz":""}"/></svg><b id="tm-t" class="tm-t">00:00</b></div>
    <div class="row" style="justify-content:center"><button class="btn" id="tm-p">Pause</button><button class="btn ghost" id="tm-s">${Timer.phase==="fokus"?"Beenden & speichern":"Pause beenden"}</button></div></div>`;
  return `<div class="card tmr"><div class="row sp"><h3 style="margin:0">Fokus-Timer</h3><span class="streak">${ic("flame")} ${st} ${st===1?"Tag":"Tage"} am Stück</span></div>
    <p class="mu">Konzentriert lernen, danach 5 Minuten Pause. Die Zeit zählt in deine Statistik.</p>
    <div class="row"><select id="tm-f" aria-label="Fach"><option value="">Allgemein</option>${subjOpts(S.lastTimerF||"")}</select>
    <div class="seg" role="group" aria-label="Dauer">${[25,45,60].map(m=>`<button class="${(S.lastTimerM||25)===m?"on":""}" data-tm="${m}">${m}′</button>`).join("")}</div><button class="btn" id="tm-go">Start</button></div></div>`;}
function bindTimer(){if($("tm-go")){document.querySelectorAll("[data-tm]").forEach(b=>b.onclick=()=>{Store.state.lastTimerM=+b.dataset.tm;document.querySelectorAll("[data-tm]").forEach(x=>x.classList.toggle("on",x===b));});
    $("tm-go").onclick=()=>{const f=$("tm-f").value;Store.state.lastTimerF=f;Timer.start(Store.state.lastTimerM||25,f);rerender();};}
  if($("tm-p")){$("tm-p").onclick=()=>Timer.toggle();$("tm-s").onclick=()=>Timer.stop();Timer.paint();}}

async function exportZ(z,kind,msg,btn){if(!z)return;const hs=parseZ(z.body).filter(b=>b.k==="h2");
  const body=`<h1>${esc(z.thema)}</h1><p class="meta">${esc(z.fach)} · ${esc(z.label||"Lernzettel")} · Stand ${new Date(z.edited||z.ts).toLocaleDateString("de-DE")}</p>${hs.length>=3?`<div class="toc"><b>Inhalt</b>${hs.map((h,i)=>`<a href="#s-${i}">${fx(h.a)}</a>`).join("")}</div>`:""}${(z.kind==="zettel"?zHtml(parseZ(z.body),"s"):`<div style="white-space:pre-wrap">${esc(z.body)}</div>`).replace(/<details class="zq">/g,'<details class="zq" open>')}`;
  const name=(z.fach+" - "+z.thema).replace(/[\\/:*?"<>|]+/g,"").slice(0,80);
  if(kind==="html"&&!IN_CLAUDE){const doc=`<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>${esc(z.thema)}</title><style>${EXPORT_CSS}</style></head><body>${body}<\x73cript>setTimeout(function(){try{window.print()}catch(e){}},400)<\/\x73cript></body></html>`;
    const url=URL.createObjectURL(new Blob([doc],{type:"text/html;charset=utf-8"})),win=window.open(url,"_blank");setTimeout(()=>URL.revokeObjectURL(url),60000);
    if(!win)browserDownload(name+".html",doc);if(msg)msg.textContent=win?"Druckansicht geöffnet. Dort kannst du drucken oder „Als PDF speichern“ wählen.":"Pop-up blockiert, die Druckversion wurde stattdessen heruntergeladen.";return;}
  if(kind==="html"){await saveFile(name+".html",`<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>${esc(z.thema)}</title><style>${EXPORT_CSS}</style></head><body>${body}<\x73cript>setTimeout(function(){try{window.print()}catch(e){}},400)<\/\x73cript></body></html>`,msg);if(msg&&/Gespeichert/.test(msg.textContent))msg.textContent+=". Öffne die Datei: Der Druckdialog erscheint, dort kannst du auch „Als PDF speichern“ wählen.";return;}
  btn.disabled=true;btn.classList.add("busy");if(msg)msg.textContent="PDF wird erstellt …";
  try{await need("pdfx");const host=document.createElement("div");host.style.cssText="position:fixed;left:-10000px;top:0;width:760px;background:#fff";host.innerHTML=`<style>${EXPORT_CSS.replace(/body\{/g,".xp{")}</style><div class="xp">${body}</div>`;document.body.appendChild(host);
    const blob=await window.html2pdf().set({margin:[12,12,14,12],filename:name+".pdf",image:{type:"jpeg",quality:.95},html2canvas:{scale:2,backgroundColor:"#ffffff"},jsPDF:{unit:"mm",format:"a4"},pagebreak:{mode:["css","legacy"],avoid:[".zbx",".zmm",".zta",".ztl",".zfl"]}}).from(host.querySelector(".xp")).outputPdf("blob");
    host.remove();await saveFile(name+".pdf",blob,msg);}
  catch(e){if(msg)msg.textContent=(e&&e.message)||"Das PDF konnte nicht erstellt werden. Nutze die Druckversion.";}
  btn.disabled=false;btn.classList.remove("busy");}

      const have=new Set((S.gloss[f]||[]).map(e=>e.t.toLowerCase())),add=(Array.isArray(arr)?arr:[]).filter(e=>e&&e.t&&e.d&&!have.has(String(e.t).toLowerCase())).map(e=>({id:uid(),t:String(e.t).slice(0,200),d:String(e.d).slice(0,700),k:e.k==="formel"?"formel":"begriff",th:TOP(f).includes(e.th)?e.th:(all?"Allgemein":th)}));

const QS=["q1","q2","q3","q4"];
function abiCalc(){const S=Store.state,G=S.grades||{},fs=focus(),L=LAND(),C=L.courses,lk=fs.filter(f=>isLK(f)),ex=G._exams||{};
  const courses=[];Object.keys(G).filter(f=>f!=="_exams").forEach(f=>QS.forEach(q=>{const v=G[f]&&G[f][q];if(v!==""&&v!=null&&!isNaN(v))courses.push({f,q,p:Math.max(0,Math.min(15,+v))});}));
  const must=courses.filter(c=>fs.includes(c.f)),rest=courses.filter(c=>!fs.includes(c.f)).sort((a,b)=>b.p-a.p),used=[...must,...rest.slice(0,Math.max(0,C-must.length))];
  const w=c=>lk.includes(c.f)?L.lkW:1,P=used.reduce((a,c)=>a+c.p*w(c),0),W=used.reduce((a,c)=>a+w(c),0),E1=W?Math.round(P/W*40):0;
  const avgOf=f=>{const v=courses.filter(c=>c.f===f);return v.length?v.reduce((a,c)=>a+c.p,0)/v.length:null;};
  const exP=fs.map(f=>{const v=ex[f];return (v!==""&&v!=null&&!isNaN(v))?{f,p:+v,est:false}:{f,p:avgOf(f)!=null?Math.round(avgOf(f)):null,est:true};});
  const E2=exP.reduce((a,x)=>a+(x.p!=null?x.p*L.exF:0),0),mx2=fs.length*15*L.exF,E=E1+E2,N=noteOf(E);

    [E2>=100,"Block II: mindestens 100 Punkte"],[exP.filter(x=>x.p!=null&&x.p>=5).length>=3&&(!lk.length||exP.filter(x=>lk.includes(x.f)).some(x=>x.p!=null&&x.p>=5)),"Block II: in 3 Prüfungsfächern"+(lk.length?" (darunter ein LK)":"")+" mindestens 5 Punkte"],[!exP.some(x=>x.p===0),"Block II: keine Prüfung mit 0 Punkten"]];

const mb=b=>b<1e6?Math.max(1,Math.round(b/1e3))+" KB":(b/1e6).toFixed(1).replace(".",",")+" MB";
async function storageInfo(){const S=Store.state,len=JSON.stringify(S).length,files=(S.files||[]).reduce((a,f)=>a+f.chunks.join("").length,0);
  let t=`Deine Daten: ca. ${mb(len*2)} (davon Unterlagen ${mb(files*2)}). Gespeichert ${Store.mode==="idb"?"in der Browser-Datenbank":"im einfachen Browser-Speicher (max. ca. 5 MB)"}.`;
  try{if(navigator.storage&&navigator.storage.estimate){const e=await navigator.storage.estimate();if(e.quota)t+=` Belegt: ${mb(e.usage||0)} von ${mb(e.quota)}.`;}
    if(navigator.storage&&navigator.storage.persisted)t+=(await navigator.storage.persisted())?" Dauerhaft gespeichert.":" Der Browser darf die Daten bei Platzmangel löschen.";}catch(e){}
  if(Store.err)t+=" Achtung: Das letzte Speichern ist fehlgeschlagen.";return t;}
async function cleanup(silent){const S=Store.state,cut=dayAdd(todayK(),-60),c30=dayAdd(todayK(),-30);let n=0;
  ["done","skip"].forEach(m=>Object.keys(S[m]).forEach(k=>{if(!S[m][k]||k.split("|")[0]<cut){delete S[m][k];n++;}}));
  const agg={},keep=[];S.log.forEach(l=>{if(l.d>=c30){keep.push(l);return;}const k=l.d+"|"+(l.f||"");if(agg[k]){agg[k].min+=l.min;n++;}else agg[k]={d:l.d,f:l.f||null,min:l.min,src:"sum",k:null,ts:l.ts};});
  S.log=[...Object.values(agg),...keep].sort((a,b)=>a.d.localeCompare(b.d));
  Object.keys(S.status).forEach(k=>{const i=k.indexOf("|"),f=k.slice(0,i),t=k.slice(i+1);if(!TOP(f).includes(t)){delete S.status[k];n++;}});
  if(Store.mode==="idb"){try{const ids=new Set(S.files.map(f=>"file:"+f.id)),orphans=(await IDB.keys()).filter(k=>String(k).startsWith("file:")&&!ids.has(k));if(orphans.length){await IDB.setMany([],orphans);n+=orphans.length;}}catch(e){}}
  S.lastClean=todayK();Store.save();if(!silent&&n)toast(n+" alte Einträge aufgeräumt.");return n;}

  if(wz===2)body=`<h2>Prüfungstermine</h2><p class="mu">${LAND().full?"Die offiziellen Termine des Landesabiturs 2027 sind eingetragen. Mündliche Prüfungen legt deine Schule fest, frühestens ab 10. Mai.":"Trag die Termine deiner Prüfungen ein, soweit du sie schon kennst. Du kannst sie später ändern."}</p><div class="col">${focus().map(f=>`<label class="wzl"><span>${esc(f)} · ${roleTxt(f)}</span><input type="date" data-wed="${esc(f)}" value="${esc(effDate(f))}"></label>`).join("")}</div>`;
  if(wz===3)body=`<h2>Stundenplan</h2><p class="mu">Dein Plan hat ${SCHULE.length} Unterrichtsblöcke: ${WDN.slice(0,5).map((n,i)=>n+" bis "+(schoolEnd(i)?hm(schoolEnd(i)):"–")).join(", ")}. Neuer Plan? Lies ihn aus einem Screenshot ein. Einzelne Stunden änderst du später unter Profil → Stundenplan.</p>${schImportBox("wz-img")}<p><button class="btn ghost" id="wz-empty">${SCHULE.length?"Mit leerem Stundenplan starten":"Stundenplan ist leer"}</button></p>`;
  if(wz===4)body=`<h2>Wie viel Zeit hast du?</h2><p class="mu">Lernzeit pro Wochentag. Ferien und einzelne Tage ohne Zeit trägst du unter Plan → Zeiten & Ferien ein.</p><div class="avl">${WDL.map((n,i)=>`<label class="avr"><b>${n}</b><span class="mu">${i<5&&schoolEnd(i)?"Schule bis "+hm(schoolEnd(i)):"keine Schule"}</span><select data-wav="${i}">${[0,15,20,30,45,60,75,90,120,150,180].map(m=>`<option value="${m}" ${+S.avail[i]===m?"selected":""}>${m?hDur(m):"frei"}</option>`).join("")}</select></label>`).join("")}</div>
    <label class="wzl" style="margin-top:14px"><span>Abitur-Lernplan startet am</span><input type="date" id="wz-st" value="${esc(S.start)}"></label><p class="mu" style="margin:4px 0 0">Vorher plant die App nur die Vorbereitung auf eingetragene Klausuren.</p>
    ${LAND().full?`<label class="mu" style="display:block;margin-top:12px"><input type="checkbox" id="wz-fer" ${FERIEN_HE.every(f=>S.periods.some(p=>p.from===f.from))?"checked disabled":""}> Hessische Ferien 2026/27 eintragen (bitte später mit dem Schulkalender abgleichen)</label>`:`<p class="mu" style="margin-top:12px">Deine Ferien trägst du unter Plan → Zeiten & Ferien ein.</p>`}`;
  if(wz===5)body=`<h2>Fertig</h2><p>Dein Plan ist eingerichtet. Unter <b>Heute</b> siehst du jeden Tag, was dran ist. Unter <b>Lernen</b> findest du Lernzettel, Karteikarten und dein Glossar, unter <b>Prüfungen</b> Simulationen, mündliches Training und den Abi-Rechner.</p>`;
  $("view").innerHTML=`<div class="card wz"><div class="wzs">${steps.map((s,i)=>`<span class="${i===wz?"on":i<wz?"ok":""}">${i+1}</span>`).join("")}</div><p class="mu wzt">Schritt ${wz+1} von ${N}: ${steps[wz]}</p>${body}
    <div class="row sp" style="margin-top:20px"><div>${wz>0&&wz<N-1?`<button class="btn ghost" id="wz-b">Zurück</button>`:""}</div><div class="row">${wz<N-1?`<button class="lnk" id="wz-skip">Überspringen</button><button class="btn" id="wz-n">${wz===0?"Los geht's":"Weiter"}</button>`:`<button class="btn" id="wz-done">Zu meinem Plan</button>`}</div></div></div>`;
  document.querySelectorAll("[data-wslot]").forEach(s=>s.onchange=()=>{S.slots[s.dataset.wslot]=s.value;Store.save();rerender();});
  if($("wz-f5"))$("wz-f5").onchange=e=>{S.form5=e.target.value;Store.save();};
  if($("wz-land"))$("wz-land").onchange=e=>{setLand(e.target.value);rerender();};
  document.querySelectorAll("[data-wed]").forEach(i=>i.onchange=()=>{S.examDates[i.dataset.wed]=i.value;Store.save();});
  document.querySelectorAll("[data-wav]").forEach(x=>x.onchange=()=>{S.avail[+x.dataset.wav]=+x.value;Store.save();});
  if($("wz-empty"))$("wz-empty").onclick=()=>{S.school={per:PER0.map(p=>[...p]),les:[]};Store.norm();Store.save();rerender();};
  if($("wz-st"))$("wz-st").onchange=e=>{if(e.target.value){S.start=e.target.value;Store.save();}};
  if($("wz-fer"))$("wz-fer").onchange=e=>{if(e.target.checked){FERIEN_HE.forEach(f=>{if(!S.periods.some(p=>p.from===f.from&&p.type==="ferien"))S.periods.push({id:uid(),...f});});Store.save();}};
  if($("wz-b"))$("wz-b").onclick=()=>{wz--;rerender();};
  if($("wz-n"))$("wz-n").onclick=()=>{wz++;rerender();};
  const fin=()=>{S.setupDone=true;Store.save();wz=0;go("home");};
  if($("wz-skip"))$("wz-skip").onclick=fin;if($("wz-done"))$("wz-done").onclick=fin;
  bindSchImport();
};

/* Nach jedem Rendern: Timer, Simulationsuhr */
function afterRender(){bindTimer();clearInterval(simIv);
  if(tab==="sim"&&SIM&&!SIM.res){simIv=setInterval(()=>{const el=$("simtime");if(!el||!SIM||SIM.res){clearInterval(simIv);return;}const left=Math.max(0,SIM.min*60-Math.round((Date.now()-SIM.start)/1000));
    el.textContent=simFmt(left);el.classList.toggle("low",left<300);},1000);}}
const simFmt=s=>s<=0?"Zeit ist um":(s>=3600?Math.floor(s/3600)+":":"")+String(Math.floor(s/60)%60).padStart(2,"0")+":"+String(s%60).padStart(2,"0");

/* ===== 5. APP ===== */
async function run(btn,out,fn){btn.disabled=true;btn.classList.add("busy");out.innerHTML=SKEL;const lo=liveOut(out,false);
  try{const t=await fn(lo);lo.stop();out.textContent=t;}catch(e){lo.stop();out.textContent=e.message||"Fehler. Bitte erneut versuchen.";}btn.disabled=false;btn.classList.remove("busy");}
function render(){
  applyOpts();drawBar();
  Views[tab]();$("view").insertAdjacentHTML("afterbegin",subnav());bindZ($("view"));bindPrio($("view"));
  document.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>go(b.dataset.go));
  if(typeof afterRender==="function")afterRender();
  document.querySelectorAll(".topic[data-f]").forEach(el=>el.onclick=e=>{e.stopPropagation();Store.cycle(el.dataset.f,el.dataset.t);const y=scrollY;render();scrollTo(0,y);});
}
let sx=0,sy=0,sOk=false;
document.addEventListener("touchstart",e=>{const t=e.touches[0];sx=t.clientX;sy=t.clientY;sOk=Store.state.opts.swipe&&!e.target.closest(".tt,input,textarea,select,.ov,#bar,.subnav,.dstrip,.kc,.chat");},{passive:true});
document.addEventListener("touchend",e=>{if(!sOk)return;const t=e.changedTouches[0],dx=t.clientX-sx,dy=t.clientY-sy;if(Math.abs(dx)>70&&Math.abs(dy)<45){const n=ORDER.indexOf((AREA_OF[tab]||AREAS[0]).k)+(dx<0?1:-1);if(n>=0&&n<ORDER.length)goArea(ORDER[n]);}},{passive:true});
/* Start: erst laden (IndexedDB ist asynchron), dann anzeigen */
(async()=>{ await Store.load(); go(Store.state.setupDone?"home":"wizard"); Sync.init(); AI.get().catch(()=>{});
  if(Store.state.lastClean!==undefined&&Store.state.lastClean<dayAdd(todayK(),-30)) cleanup(true); else if(Store.state.lastClean===undefined){ Store.state.lastClean=todayK(); }
  if(!IN_CLAUDE&&navigator.storage&&navigator.storage.persist) navigator.storage.persist().catch(()=>{});
  initUpdates(); whatsNew(); })();
/* Beim Schließen oder Wechseln der App ungespeicherte Änderungen sofort schreiben */
addEventListener("pagehide",()=>{ if(Store.wt) Store.flush(); });
document.addEventListener("visibilitychange",()=>{ if(document.visibilityState==="hidden"&&Store.wt) Store.flush(); });
</script>
</body>
</html>
